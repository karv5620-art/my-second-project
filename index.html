<!DOCTYPE html>
<html>
<head>
<title>MyShop - Amazon Level</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0; padding:0; box-sizing:border-box;}
body{ background:#f2f2f2; font-family:Arial; }
.navbar{ background:black; color:white; display:flex; justify-content:space-between; align-items:center; padding:15px 20px; position:sticky; top:0; z-index:100; }
.logo{ font-weight:bold; font-size:20px; }
.logo span{ color:#ff2d55; }
.search{ background:white; border-radius:20px; padding:8px 15px; width:40%; display:flex; }
.search input{ border:none; outline:none; width:100%; }
.cart{ background:white; color:black; padding:8px 15px; border-radius:20px; font-weight:bold; font-size:14px; }
h1{ text-align:center; margin:20px 0 10px 0; }
.shop{ display:flex; gap:20px; justify-content:center; flex-wrap:wrap; padding:20px; }
.card{ background:white; width:300px; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1); transition:0.3s; }
.card:hover{ transform:translateY(-5px); }
img{ width:100%; height:220px; object-fit:cover; }
.content{ padding:15px; }
.content h2{ font-size:18px; margin-bottom:5px; }
.price{ display:flex; gap:8px; align-items:center; margin:10px 0; }
.new{ font-weight:bold; font-size:20px; }
.old{ color:#999; text-decoration:line-through; font-size:13px; }
.off{ background:#e3ffe3; color:green; padding:3px 6px; border-radius:5px; font-size:11px; font-weight:bold; }
button{ width:100%; background:black; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; }
button:hover{ background:#ff2d55; }
</style>
</head>
<body>

<div class="navbar">
<div class="logo">My<span>Shop</span> 🔥</div>
<div class="search"><input type="text" placeholder="Search for Shoes, Watch..."></div>
<div class="cart">🛒 Cart (0)</div>
</div>

<h1>🔥 My First Shop</h1>
<div class="shop">
<div class="card"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=500"><div class="content"><h2>Nike Red Shoes</h2><div class="price"><span class="new">₹4,999</span><span class="old">₹8,999</span><span class="off">44% OFF</span></div><button>Add to Cart</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=500"><div class="content"><h2>Boat Watch</h2><div class="price"><span class="new">₹2,499</span><span class="old">₹5,999</span><span class="off">58% OFF</span></div><button>Add to Cart</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=500"><div class="content"><h2>Puma Bag</h2><div class="price"><span class="new">₹1,199</span><span class="old">₹2,499</span><span class="off">52% OFF</span></div><button>Add to Cart</button></div></div>
</div>

</body>
</html>

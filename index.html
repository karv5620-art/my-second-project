<!DOCTYPE html>
<html>
<head>
<title>Project 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ background:#f5f5f5; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
.card{ background:white; width:320px; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
img{ width:100%; height:250px; object-fit:cover; }
.content{ padding:20px; }
.brand{ color:#888; font-size:12px; }
h2{ margin:5px 0; font-size:22px; }
.rating{ color:#ff9800; font-size:14px; margin:8px 0; }
.price{ display:flex; align-items:center; gap:10px; margin:15px 0; }
.new{ font-size:24px; font-weight:bold; }
.old{ color:#999; text-decoration:line-through; }
.off{ background:#e3ffe3; color:green; padding:4px 8px; border-radius:5px; font-size:12px; font-weight:bold; }
button{ width:100%; background:black; color:white; border:none; padding:14px; border-radius:12px; font-size:16px; font-weight:bold; }
</style>
</head>
<body>
<div class="card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=500">
<div class="content">
<span class="brand">NIKE • SHOES</span>
<h2>Air Max Pro - Limited</h2>
<div class="rating">⭐⭐⭐⭐⭐ (4.9) • 2.1k Reviews</div>
<div class="price">
<span class="new">₹4,999</span>
<span class="old">₹8,999</span>
<span class="off">44% OFF</span>
</div>
<button onclick="alert('Added to Cart!')">Add to Cart - Buy Now</button>
</div>
</div>
</body>
</html>
